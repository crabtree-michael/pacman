<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover plus the safe-area insets in main.css keep the HUD
         and the control zone clear of notches and home indicators. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Pac-Man, built for mobile web." />
    <!-- The PNG first and the SVG second: a browser without SVG favicon
         support ignores the second link, and one with it prefers the last
         icon it understands. Both are drawn from the same geometry — see
         tools/generate-icons.ts. -->
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Pac-Man</title>
  </head>
  <body>
    <div id="app" class="app">
      <header class="hud" data-hud-root>
        <div class="hud__item">
          <span class="hud__label">1UP</span>
          <span class="hud__value" data-hud="score">00</span>
        </div>
        <div class="hud__item">
          <span class="hud__label">High</span>
          <span class="hud__value" data-hud="high-score">00</span>
        </div>
        <button
          class="hud__button"
          type="button"
          data-action="sound"
          aria-label="Sound"
          aria-pressed="true"
        >
          <span data-sound-on>&#128266;</span>
          <span data-sound-off hidden>&#128263;</span>
        </button>
        <button class="hud__button" type="button" data-action="pause" aria-label="Pause">
          &#9208;
        </button>
      </header>

      <!-- Three stacked canvases: the maze redraws once per level, the entity
           layer every frame, the overlay only when its text changes. -->
      <main class="stage" id="stage">
        <div class="stage__board" id="board">
          <canvas class="stage__layer" id="layer-maze"></canvas>
          <canvas class="stage__layer" id="layer-entities"></canvas>
          <canvas class="stage__layer" id="layer-overlay"></canvas>
        </div>

        <!-- The pause card itself is canvas; its options are DOM, so they are
             real hit targets that assistive tech can find. Deliberately a
             sibling of the board rather than a child: the board is the swipe
             surface, and a tap captured as the start of a flick is a tap the
             button might never see. -->
        <div class="pause-menu" data-pause-menu>
          <button class="pause-menu__button" type="button" data-action="new-game">
            New Game
          </button>
        </div>
      </main>

      <!-- Lives on the left, the fruit of the levels reached on the right
           (product spec §2.1). Both are filled in by the HUD. -->
      <div class="status" data-hud-root>
        <span class="status__lives" data-hud="lives"></span>
        <span class="status__levels" data-hud="levels"></span>
      </div>

      <!-- The whole band is the joystick's hit area. Nothing else in it is
           interactive, so a stray thumb can never hit a button. -->
      <footer class="control-zone" id="control-zone">
        <div class="joystick__base" data-joystick-base data-direction="none">
          <!-- The chevron shows the *snapped* direction while the knob runs
               along the slot for that direction, out as far as the thumb has
               pushed it (product spec §3.2). -->
          <div class="joystick__chevron" data-joystick-chevron></div>
          <div class="joystick__knob" data-joystick-knob></div>
        </div>
      </footer>

      <p class="too-small">Screen too small to play — try a wider window.</p>

      <!-- Shown only if the sprite atlas cannot be fetched. The game draws its
           characters from it, so there is nothing to fall back to. -->
      <p class="load-error" id="boot-error" hidden role="alert">
        Could not load the game's artwork. Check your connection and reload.
      </p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
